name: smiletrack
description: smileTrack - Your Personal Oral Hygiene Tracker
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  go_router: ^13.0.1
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  table_calendar: ^3.0.9
  image_picker: ^1.0.7
  file_picker: ^10.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  http: ^1.1.2
  uuid: ^4.2.2
  google_generative_ai: ^0.4.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6
  sqflite: ^2.4.2
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7

